name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/inkbird_bbq/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish version tag and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("custom_components/inkbird_bbq/manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          print(data["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid manifest version: $VERSION" >&2
            exit 1
          fi

      - name: Run release validation
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant pytest pytest-asyncio ruff PyYAML
          python -m compileall -q custom_components tests
          ruff check custom_components tests
          pytest -q

      - name: Build HACS release archive
        shell: bash
        run: |
          mkdir -p dist
          cd custom_components/inkbird_bbq
          zip -r "../../dist/inkbird_bbq.zip" . \
            -x "__pycache__/*" "*.pyc"
          cd ../..
          test -s dist/inkbird_bbq.zip

      - name: Publish GitHub release if tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to publish."
            exit 0
          fi

          prerelease_flag=""
          if [[ "$VERSION" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "$TAG" dist/inkbird_bbq.zip \
            --target "$GITHUB_SHA" \
            --title "INKBIRD BBQ $VERSION" \
            --generate-notes \
            $prerelease_flag
