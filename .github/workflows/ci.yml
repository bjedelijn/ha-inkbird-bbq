name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant pytest ruff

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/inkbird_bbq/manifest.json >/dev/null
          python -m json.tool custom_components/inkbird_bbq/strings.json >/dev/null
          python -m json.tool custom_components/inkbird_bbq/translations/en.json >/dev/null
          python -m json.tool custom_components/inkbird_bbq/translations/nl.json >/dev/null
          python -m json.tool hacs.json >/dev/null

      - name: Validate updater shell syntax
        run: bash -n scripts/update_inkbird_bbq.sh

      - name: Ruff
        run: ruff check custom_components tests

      - name: Pytest
        run: pytest -q
