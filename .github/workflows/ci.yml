name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant pytest pytest-asyncio ruff

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/inkbird_bbq/manifest.json >/dev/null
          python -m json.tool custom_components/inkbird_bbq/strings.json >/dev/null
          python -m json.tool custom_components/inkbird_bbq/translations/en.json >/dev/null
          python -m json.tool custom_components/inkbird_bbq/translations/nl.json >/dev/null
          python -m json.tool hacs.json >/dev/null

      - name: Validate updater shell syntax
        run: bash -n scripts/update_inkbird_bbq.sh

      - name: Validate Home Assistant integration metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/inkbird_bbq/manifest.json").read_text()
          )
          hacs = json.loads(Path("hacs.json").read_text())

          assert manifest["domain"] == "inkbird_bbq"
          assert manifest["name"] == hacs["name"]
          assert manifest["config_flow"] is True
          assert manifest["integration_type"] == "device"
          assert manifest["iot_class"] == "local_push"
          assert "bluetooth" in manifest["dependencies"]
          assert manifest["documentation"].startswith("https://github.com/")
          assert manifest["issue_tracker"].startswith("https://github.com/")
          assert manifest["version"]
          assert {item["local_name"] for item in manifest["bluetooth"]} == {
              "ISC-027BW",
              "INT-14-BW",
              "INT-14-BW_WH",
          }
          PY

      - name: Validate local brand icons
        run: |
          python - <<'PY'
          from pathlib import Path

          from PIL import Image

          brand = Path("custom_components/inkbird_bbq/brand")
          expected = {
              "icon.png": (512, 512),
              "dark_icon.png": (512, 512),
              "icon@2x.png": (512, 512),
              "dark_icon@2x.png": (512, 512),
          }
          for filename, dimensions in expected.items():
              path = brand / filename
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  assert image.size == dimensions
          PY

      - name: Ruff
        run: ruff check custom_components tests

      - name: Pytest
        run: pytest -q
